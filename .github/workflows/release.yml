name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build dependencies
        run: brew install cmake pkg-config ffmpeg

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package (build core, bundle FFmpeg, ad-hoc sign)
        run: npm run package:mac

      - name: Verify bundle does not depend on Homebrew
        run: |
          APP_DIR=$(ls -d release/mac*/ | head -1)
          RES="${APP_DIR}Babu Studio.app/Contents/Resources/media-core"
          for f in "$RES"/bin/* "$RES"/lib/*; do
            if otool -L "$f" | grep -E "/opt/homebrew|/usr/local"; then
              echo "::error::$f links to a build-machine path"; exit 1
            fi
          done
          env -i PATH=/usr/bin:/bin "$RES/bin/ffmpeg" -version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: babu-studio-${{ matrix.arch }}
          path: |
            release/Babu-Studio-*.dmg
            release/Babu-Studio-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
