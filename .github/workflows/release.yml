name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build dependencies
        run: brew install cmake pkg-config ffmpeg

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package (build core, bundle FFmpeg, ad-hoc sign)
        run: npm run package:mac

      - name: Verify bundle does not depend on Homebrew
        run: |
          APP_DIR=$(ls -d release/mac*/ | head -1)
          RES="${APP_DIR}Babu Studio.app/Contents/Resources/media-core"
          for f in "$RES"/bin/* "$RES"/lib/*; do
            if otool -L "$f" | grep -E "/opt/homebrew|/usr/local"; then
              echo "::error::$f links to a build-machine path"; exit 1
            fi
          done
          env -i PATH=/usr/bin:/bin "$RES/bin/ffmpeg" -version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: babu-studio-${{ matrix.arch }}
          path: |
            release/Babu-Studio-*.dmg
            release/Babu-Studio-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Scan installers with ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet
          # Non-zero exit (infected files) fails the release.
          clamscan --recursive --scan-archive=yes --infected dist | tee clamav-scan.log
          echo "Scanned with ClamAV $(clamscan --version) on $(date -u +%F)" >> clamav-scan.log

      - name: Write checksums
        working-directory: dist
        run: sha256sum Babu-Studio-* | grep -v blockmap > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Babu-Studio-*.dmg
            dist/Babu-Studio-*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            clamav-scan.log
          generate_release_notes: true
          # Beta tags (e.g. v0.1.1-beta.1) stay pre-releases so they never
          # become the repo's latest release.
          prerelease: ${{ contains(github.ref_name, 'beta') }}

      # Optional: runs only when the VT_API_KEY repository secret exists.
      - name: Submit installers to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$VT_API_KEY" ] && { echo "VT_API_KEY not set; skipping VirusTotal."; exit 0; }
          {
            echo
            echo "## Security"
            echo "- SHA-256 checksums: \`SHA256SUMS\`. ClamAV scan log: \`clamav-scan.log\`."
            echo "- Verify provenance: \`gh attestation verify <file> --repo ${{ github.repository }}\`"
            echo "- VirusTotal reports:"
          } > security.md
          for f in dist/Babu-Studio-*.dmg dist/Babu-Studio-*.zip; do
            url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@$f" "$url" > /dev/null
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "  - $(basename "$f"): https://www.virustotal.com/gui/file/$hash" >> security.md
            sleep 16
          done
          gh release view "${{ github.ref_name }}" --json body -q .body > notes.md
          cat security.md >> notes.md
          gh release edit "${{ github.ref_name }}" --notes-file notes.md
