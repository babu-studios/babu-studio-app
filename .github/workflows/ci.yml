name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install cmake pkg-config ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
